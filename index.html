<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Refer & Earn - Telegram Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              telegram: '#24A1DE',
              'telegram-hover': '#1C82B5',
              darkBg: '#0B0F19',
              cardBg: '#131B2E',
              cardBorder: '#1E293B',
              accentGold: '#F59E0B',
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #0B0F19;
        color: #F8FAFC;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .animate-spin-fast {
        animation: spin 0.6s linear infinite;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .glow-gold {
        box-shadow: 0 0 30px -5px rgba(245, 158, 11, 0.2);
      }
      .glow-telegram {
        box-shadow: 0 0 25px -5px rgba(36, 161, 222, 0.35);
      }
    </style>
  </head>
  <body class="min-h-screen pb-10 flex flex-col justify-between antialiased selection:bg-telegram selection:text-white">

    <!-- Toast Notification Overlay -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 transform -translate-y-16 opacity-0 transition-all duration-300 pointer-events-none">
      <div class="bg-slate-800/95 border border-slate-700/80 backdrop-blur-md text-white px-4 py-2.5 rounded-2xl shadow-2xl flex items-center gap-2.5 text-xs font-semibold">
        <span id="toastIcon">✨</span>
        <span id="toastMessage">Notification</span>
      </div>
    </div>

    <div class="max-w-md mx-auto w-full px-4 pt-5 space-y-5">

      <!-- HEADER: PROFILE & CONNECTION STATUS -->
      <header class="flex items-center justify-between bg-cardBg/90 backdrop-blur-md p-3.5 rounded-2xl border border-cardBorder">
        <div class="flex items-center gap-3">
          <div id="userAvatar" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-telegram to-blue-600 flex items-center justify-center text-white font-bold text-base shadow-md">
            U
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <h1 id="userFirstName" class="font-bold text-sm text-slate-100">Telegram User</h1>
              <span class="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded font-mono">#<span id="userTelegramId">--</span></span>
            </div>
            <div class="flex items-center gap-1.5 mt-0.5">
              <span id="statusIndicatorDot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
              <span id="statusText" class="text-[11px] font-medium text-amber-300">Connecting to BJS...</span>
            </div>
          </div>
        </div>
      </header>

      <!-- MAIN BALANCE CARD -->
      <div class="relative overflow-hidden bg-gradient-to-b from-cardBg to-slate-900/90 rounded-3xl p-6 border border-cardBorder glow-gold">
        <!-- Glow background accents -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-telegram/10 rounded-full blur-2xl"></div>

        <div class="relative z-10 space-y-4">
          <div class="flex justify-between items-center text-xs text-slate-400 font-medium">
            <span class="flex items-center gap-1.5 uppercase tracking-wider text-[10px] text-amber-400/90 font-bold">
              <svg class="w-3.5 h-3.5 text-amber-400" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
              </svg>
              Account Balance
            </span>
            <button id="refreshBalanceBtn" class="flex items-center gap-1.5 text-xs text-telegram hover:text-cyan-400 transition font-semibold bg-telegram/10 hover:bg-telegram/20 px-2.5 py-1 rounded-lg border border-telegram/20 active:scale-95">
              <svg id="refreshSpinner" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
              </svg>
              <span>Refresh</span>
            </button>
          </div>

          <div class="flex items-baseline gap-2">
            <span id="balanceDisplay" class="text-4xl sm:text-5xl font-black text-white tracking-tight">0</span>
            <span class="text-sm font-bold text-amber-400 uppercase tracking-wider">Points</span>
          </div>

          <div class="grid grid-cols-2 gap-3 pt-3 border-t border-slate-800/80">
            <div class="bg-slate-800/40 p-3.5 rounded-2xl border border-slate-800/60">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Total Friends Invited</span>
              <span id="referralsDisplay" class="text-2xl font-black text-slate-100 mt-0.5 block">0</span>
            </div>
            <div class="bg-slate-800/40 p-3.5 rounded-2xl border border-slate-800/60 flex flex-col justify-center">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Reward Per Invite</span>
              <span class="text-sm font-bold text-emerald-400 mt-1 block flex items-center gap-1">
                <span>🎁</span> +10 Points
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- REFERRAL LINK & INVITATION SECTION -->
      <div class="bg-cardBg/90 rounded-3xl p-5 border border-cardBorder space-y-4">
        <div>
          <h2 class="text-sm font-bold text-white flex items-center gap-2">
            <svg class="w-4 h-4 text-telegram" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            Invite Friends & Earn
          </h2>
          <p class="text-xs text-slate-400 mt-1">
            Share your link! You get <strong class="text-amber-400">+10 points</strong> for every friend who joins, and they get <strong class="text-emerald-400">+5 points</strong> welcome bonus!
          </p>
        </div>

        <!-- Generated Referral Link Input Box -->
        <div class="space-y-1.5">
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Your Personal Referral Link</label>
          <div class="flex items-center gap-2 bg-slate-900/90 p-1.5 pl-3 rounded-2xl border border-slate-800">
            <input id="referralLinkInput" type="text" readonly class="bg-transparent text-xs text-slate-300 font-mono w-full focus:outline-none selection:bg-telegram" value="" />
            <button id="copyLinkBtn" class="bg-slate-800 hover:bg-slate-700 text-white font-semibold text-xs px-3.5 py-2.5 rounded-xl border border-slate-700 transition flex items-center gap-1.5 whitespace-nowrap active:scale-95">
              <svg class="w-3.5 h-3.5 text-telegram" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
              </svg>
              <span id="copyBtnText">Copy</span>
            </button>
          </div>
        </div>

        <!-- Share Action Button -->
        <div class="pt-1">
          <button id="inviteFriendsBtn" class="w-full bg-telegram hover:bg-telegram-hover text-white font-bold text-sm py-3.5 px-4 rounded-2xl shadow-lg glow-telegram transition flex items-center justify-center gap-2 active:scale-98">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.96 1.25-5.54 3.67-.52.36-1 .54-1.42.53-.47-.01-1.37-.26-2.04-.48-.82-.27-1.47-.42-1.42-.88.03-.24.37-.49 1.02-.74 3.99-1.74 6.66-2.89 8.01-3.45 3.81-1.59 4.6-1.87 5.12-1.88.11 0 .37.03.54.17.14.12.18.28.2.45-.02.07-.02.21-.04.35z"/>
            </svg>
            <span>Share Link to Telegram Chat</span>
          </button>
        </div>
      </div>

    </div>

    <!-- SCRIPT LOGIC -->
    <script>
      // =========================================================================
      // CONFIGURATION & GLOBAL CONSTANTS
      // =========================================================================
      const BOT_USERNAME = "Ebisarfrbot";
      const WEBHOOK_URL = "https://api.bots.business/v1/bots/2992688/new-webhook?command=%2Fapi_getBalance&public_user_token=30f946846808ad74d9d9d48ebcc68110&user_id=25765842";

      let userId = "0";
      let userFirstName = "Guest";

      // DOM Elements
      const userAvatarEl = document.getElementById("userAvatar");
      const userFirstNameEl = document.getElementById("userFirstName");
      const userTelegramIdEl = document.getElementById("userTelegramId");
      const statusIndicatorDot = document.getElementById("statusIndicatorDot");
      const statusText = document.getElementById("statusText");

      const balanceDisplay = document.getElementById("balanceDisplay");
      const referralsDisplay = document.getElementById("referralsDisplay");
      const refreshBalanceBtn = document.getElementById("refreshBalanceBtn");
      const refreshSpinner = document.getElementById("refreshSpinner");

      const referralLinkInput = document.getElementById("referralLinkInput");
      const copyLinkBtn = document.getElementById("copyLinkBtn");
      const copyBtnText = document.getElementById("copyBtnText");
      const inviteFriendsBtn = document.getElementById("inviteFriendsBtn");

      // =========================================================================
      // TELEGRAM WEBAPP SDK SETUP
      // =========================================================================
      function initTelegramApp() {
        const tg = window.Telegram?.WebApp;
        if (tg) {
          try {
            tg.ready();
            tg.expand();
            tg.headerColor = "#0B0F19";
            tg.backgroundColor = "#0B0F19";

            if (tg.initDataUnsafe?.user) {
              const u = tg.initDataUnsafe.user;
              userId = String(u.id);
              userFirstName = u.first_name || "Telegram User";
            }
          } catch (e) {
            console.warn("Telegram WebApp init error:", e);
          }
        }

        userFirstNameEl.textContent = userFirstName;
        userTelegramIdEl.textContent = userId !== "0" ? userId : "Guest";
        userAvatarEl.textContent = (userFirstName[0] || "U").toUpperCase();

        // Unique referral link format: https://t.me/Ebisarfrbot?start=ref_<userId>
        referralLinkInput.value = `https://t.me/${BOT_USERNAME}?start=ref_${userId}`;
      }

      function triggerHaptic(type = "light") {
        if (window.Telegram?.WebApp?.HapticFeedback) {
          try {
            if (type === "success") {
              window.Telegram.WebApp.HapticFeedback.notificationOccurred("success");
            } else if (type === "medium") {
              window.Telegram.WebApp.HapticFeedback.impactOccurred("medium");
            } else {
              window.Telegram.WebApp.HapticFeedback.impactOccurred("light");
            }
          } catch (e) {}
        }
      }

      function showToast(msg, icon = "✨") {
        const toast = document.getElementById("toast");
        const toastMsg = document.getElementById("toastMessage");
        const toastIcon = document.getElementById("toastIcon");

        toastMsg.textContent = msg;
        toastIcon.textContent = icon;

        toast.classList.remove("-translate-y-16", "opacity-0");
        toast.classList.add("translate-y-0", "opacity-100");

        setTimeout(() => {
          toast.classList.remove("translate-y-0", "opacity-100");
          toast.classList.add("-translate-y-16", "opacity-0");
        }, 2500);
      }

      // =========================================================================
      // FETCH REAL DATA FROM BOTS.BUSINESS WEBHOOK
      // =========================================================================
      async function fetchRealBalance() {
        triggerHaptic("light");
        refreshSpinner.classList.add("animate-spin-fast");

        if (statusIndicatorDot && statusText) {
          statusIndicatorDot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
          statusText.textContent = "Syncing with BJS...";
          statusText.className = "text-[11px] font-medium text-amber-300";
        }

        try {
          // Call the exact webhook URL provided by Bots.business without altering searchParams
          const res = await fetch(WEBHOOK_URL, {
            method: "GET",
            headers: { "Accept": "application/json" }
          });

          if (res.ok) {
            const data = await res.json();
            if (data && (data.balance !== undefined || data.status === "success")) {
              balanceDisplay.textContent = Number(data.balance || 0).toLocaleString();
              referralsDisplay.textContent = Number(data.referrals || 0).toLocaleString();

              if (statusIndicatorDot && statusText) {
                statusIndicatorDot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                statusText.textContent = "Synced with Bots.business";
                statusText.className = "text-[11px] font-medium text-emerald-400";
              }
            } else {
              throw new Error("Invalid response format");
            }
          } else {
            throw new Error(`HTTP ${res.status}`);
          }
        } catch (err) {
          console.warn("Bots.business Webhook Fetch Error:", err);
          if (statusIndicatorDot && statusText) {
            statusIndicatorDot.className = "w-2 h-2 rounded-full bg-rose-500";
            statusText.textContent = "Webhook Offline";
            statusText.className = "text-[11px] font-medium text-rose-300";
          }
        } finally {
          refreshSpinner.classList.remove("animate-spin-fast");
        }
      }

      // =========================================================================
      // SHARE & COPY LOGIC
      // =========================================================================
      function copyReferralLink() {
        triggerHaptic("success");
        const link = referralLinkInput.value;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link).then(onCopied).catch(fallbackCopy);
        } else {
          fallbackCopy();
        }

        function fallbackCopy() {
          referralLinkInput.select();
          document.execCommand("copy");
          onCopied();
        }

        function onCopied() {
          copyBtnText.textContent = "Copied!";
          showToast("Referral link copied!", "📋");
          setTimeout(() => {
            copyBtnText.textContent = "Copy";
          }, 2000);
        }
      }

      function shareViaTelegram() {
        triggerHaptic("medium");
        const link = referralLinkInput.value;
        const text = encodeURIComponent("🚀 Join me on this Mini App and get 5 Bonus Points immediately!");
        const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${text}`;

        const tg = window.Telegram?.WebApp;
        if (tg && typeof tg.openTelegramLink === "function") {
          tg.openTelegramLink(shareUrl);
        } else {
          window.open(shareUrl, "_blank");
        }
      }

      // =========================================================================
      // INITIALIZATION
      // =========================================================================
      refreshBalanceBtn.addEventListener("click", fetchRealBalance);
      copyLinkBtn.addEventListener("click", copyReferralLink);
      inviteFriendsBtn.addEventListener("click", shareViaTelegram);

      window.addEventListener("DOMContentLoaded", () => {
        initTelegramApp();
        fetchRealBalance();
      });
    </script>
  </body>
</html>
